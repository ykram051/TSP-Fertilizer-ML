service:
  name: tsp-slurry-free-acid-shadow
  mode: target_free              # target_free | target_anchored
  forecast_horizon_minutes: 10   # used only by target_anchored
  cadence_seconds: 60
  cadence_tolerance_seconds: 5
  maximum_buffer_rows: 180
  runtime_directory: /runtime

opc:
  endpoint: opc.tcp://opc-simulator:4840/tsp-simulator/
  security_mode: None            # laboratory only; production must use SignAndEncrypt
  security_policy: None
  username: null
  password_environment_variable: OPC_PASSWORD
  subscription_period_ms: 100
  reconnect_delay_seconds: 5

manual_laboratory_target:
  variable: SLURRY_FREE_ACID
  timestamp_node_key: SLURRY_FREE_ACID_LAB_TIMESTAMP
  maximum_age_minutes: 120
  require_timestamp_for_target_anchored: true

quality:
  reject_bad_or_uncertain: true
  reject_non_monotonic_timestamps: true
  reject_impossible_values: true
  # The trained pipeline imputes isolated missing cells and includes missingness
  # indicators. Reject only when more than 25% of required process inputs are
  # absent in the same minute.
  maximum_missing_required_share: 0.25

outputs:
  advisory_write_enabled: false
  sqlite_database: /runtime/predictions.sqlite3
  sqlite_schema: /database/schema.sql
  jsonl_predictions: /runtime/predictions.jsonl
  latest_prediction_file: /runtime/latest_prediction.json
  health_file: /runtime/health.json
  service_log: /runtime/service.log

simulator:
  csv_path: /data/tsp_1min.csv
  replay_interval_seconds: 1.00
  loop: false
  laboratory_update_every_rows: 60
